<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Framework figure placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8F7F3"/>
      <stop offset="1" stop-color="#FFF0EE"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06A77D"/>
      <stop offset="1" stop-color="#14B89F"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E63A46"/>
      <stop offset="1" stop-color="#F26A5A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)" rx="20"/>

  <!-- chunk boxes -->
  <g font-family="DM Sans, system-ui, sans-serif" font-size="14" fill="#0F1F2E">
    <rect x="80" y="180" width="180" height="160" rx="14" fill="#fff" stroke="#06A77D" stroke-width="2"/>
    <text x="170" y="170" text-anchor="middle" font-weight="600">chunk t-1</text>
    <text x="170" y="265" text-anchor="middle" fill="#5A6677">frames</text>

    <rect x="340" y="180" width="180" height="160" rx="14" fill="#fff" stroke="#06A77D" stroke-width="2"/>
    <text x="430" y="170" text-anchor="middle" font-weight="600">chunk t</text>
    <text x="430" y="265" text-anchor="middle" fill="#5A6677">frames</text>

    <rect x="600" y="180" width="180" height="160" rx="14" fill="#fff" stroke="#06A77D" stroke-width="2"/>
    <text x="690" y="170" text-anchor="middle" font-weight="600">chunk t+1</text>
    <text x="690" y="265" text-anchor="middle" fill="#5A6677">frames</text>

    <!-- state cards -->
    <rect x="80" y="60" width="700" height="80" rx="14" fill="url(#teal)"/>
    <text x="430" y="108" text-anchor="middle" fill="#fff" font-weight="700" font-size="18">Adaptive State (evolves per chunk)</text>

    <!-- arrows -->
    <g stroke="#06A77D" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M170 145 V175" marker-end="url(#arr)"/>
      <path d="M430 145 V175" marker-end="url(#arr)"/>
      <path d="M690 145 V175" marker-end="url(#arr)"/>
      <path d="M260 260 H335" marker-end="url(#arr)"/>
      <path d="M520 260 H595" marker-end="url(#arr)"/>
    </g>

    <text x="600" y="430" text-anchor="middle" fill="#5A6677" font-size="13" font-style="italic">framework figure — drop your image here</text>
  </g>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#06A77D"/>
    </marker>
  </defs>
</svg>
